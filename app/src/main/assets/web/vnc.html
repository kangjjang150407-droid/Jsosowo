<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VM Screen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #screen { position: absolute; inset: 0; }
  #bar {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px; background: rgba(30,30,36,.85);
    border-radius: 0 0 10px 10px; z-index: 10; flex-wrap: wrap; justify-content: center;
    max-width: 98vw;
  }
  #bar.hidden > button:not(#toggle), #bar.hidden > #frow { display: none; }
  #frow { display: none; width: 100%; gap: 4px; justify-content: center; flex-wrap: wrap; }
  #frow.show { display: flex; }
  #bar button {
    background: #3a3a46; color: #fff; border: 0; border-radius: 6px;
    padding: 7px 9px; font-size: 13px; min-width: 34px;
  }
  #bar button.on { background: #0067c0; }
  #msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #ddd; font-size: 16px; text-align: center; padding: 20px; pointer-events: none;
    white-space: pre-line;
  }
  #kbd {
    position: absolute; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0;
  }
</style>
</head>
<body>
<div id="screen"></div>
<div id="msg">VM 화면에 연결 중…</div>
<textarea id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<div id="bar">
  <button id="toggle">☰</button>
  <button id="k">⌨</button>
  <button data-mod="ctrl">Ctrl</button>
  <button data-mod="alt">Alt</button>
  <button data-mod="shift">Shift</button>
  <button data-key="win">⊞ Win</button>
  <button data-key="Escape">Esc</button>
  <button data-key="Tab">Tab</button>
  <button data-key="Enter">Enter</button>
  <button data-key="Backspace">⌫</button>
  <button data-key="Delete">Del</button>
  <button data-combo="shift F10">Shift+F10</button>
  <button data-combo="ctrl alt Delete">Ctrl+Alt+Del</button>
  <button data-combo="ctrl shift Escape">작업관리자</button>
  <button id="fkeys">F1-12</button>
  <button id="close">✕</button>
  <div id="frow"></div>
</div>

<script type="module">
import RFB from './core/rfb.js';
import KeyTable from './core/input/keysym.js';
import keysyms from './core/input/keysymdef.js';

const params = new URLSearchParams(location.search);
const port = params.get('port') || '5700';
const url = `ws://127.0.0.1:${port}`;
const msg = document.getElementById('msg');
const screenEl = document.getElementById('screen');
const kbd = document.getElementById('kbd');
const bar = document.getElementById('bar');
let rfb = null;
let retryTimer = null;

// name -> [X11 keysym, DOM code, QEMU qcode]
const KEYS = {
  Escape: [KeyTable.XK_Escape, 'Escape', 'esc'],
  Tab: [KeyTable.XK_Tab, 'Tab', 'tab'],
  Enter: [KeyTable.XK_Return, 'Enter', 'ret'],
  Backspace: [KeyTable.XK_BackSpace, 'Backspace', 'backspace'],
  Delete: [KeyTable.XK_Delete, 'Delete', 'delete'],
  ArrowUp: [KeyTable.XK_Up, 'ArrowUp', 'up'],
  ArrowDown: [KeyTable.XK_Down, 'ArrowDown', 'down'],
  ArrowLeft: [KeyTable.XK_Left, 'ArrowLeft', 'left'],
  ArrowRight: [KeyTable.XK_Right, 'ArrowRight', 'right'],
  ctrl: [KeyTable.XK_Control_L, 'ControlLeft', 'ctrl'],
  alt: [KeyTable.XK_Alt_L, 'AltLeft', 'alt'],
  shift: [KeyTable.XK_Shift_L, 'ShiftLeft', 'shift'],
  win: [KeyTable.XK_Super_L, 'MetaLeft', 'meta_l'],
};
for (let n = 1; n <= 12; n++) KEYS['F' + n] = [KeyTable.XK_F1 + n - 1, 'F' + n, 'f' + n];

const mods = { ctrl: false, alt: false, shift: false };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function connect() {
  clearTimeout(retryTimer);
  try {
    rfb = new RFB(screenEl, url, { shared: true });
  } catch (e) {
    retry('연결 실패: ' + e);
    return;
  }
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.focusOnClick = true;
  rfb.qualityLevel = 9;
  rfb.compressionLevel = 0;
  rfb.addEventListener('connect', () => { msg.textContent = ''; });
  rfb.addEventListener('disconnect', () => {
    rfb = null;
    retry('VM 화면 연결이 끊겼습니다.');
  });
}

function retry(text) {
  const running = window.Android ? Android.isRunning() : true;
  msg.textContent = running
    ? text + '\nVM 부팅을 기다리는 중… 자동으로 다시 연결합니다.'
    : 'VM이 실행 중이 아닙니다.\n메인 화면에서 "VM 시작"을 눌러주세요.';
  retryTimer = setTimeout(connect, 2000);
}

/** Takes the sticky modifiers (Ctrl/Alt/Shift buttons) for the next key and resets them. */
function takeMods() {
  const on = Object.keys(mods).filter(m => mods[m]);
  for (const m of on) {
    mods[m] = false;
    document.querySelector(`[data-mod="${m}"]`).classList.remove('on');
  }
  return on;
}

/**
 * Press keys in order, hold them, release in reverse — like a person would.
 * Sending all four events at the same instant (the old behaviour) lets Windows miss
 * combinations such as Shift+F10.
 */
let queue = Promise.resolve();
function vncCombo(list, hold = 120) {
  // queued so that fast typing never interleaves key presses
  queue = queue.then(() => vncComboNow(list, hold)).catch(() => {});
}
async function vncComboNow(list, hold) {
  if (!rfb) return;
  for (const [sym, code] of list) { rfb.sendKey(sym, code, true); await sleep(list.length > 1 ? 40 : 0); }
  await sleep(hold);
  for (const [sym, code] of [...list].reverse()) { rfb && rfb.sendKey(sym, code, false); await sleep(25); }
}

/** Press named keys (plus any sticky modifiers) inside the VM. */
function press(...names) {
  const all = [...takeMods().filter(m => !names.includes(m)), ...names];
  // Prefer QEMU's own send-key (via the app): keys are truly held for 150 ms.
  if (window.Android && Android.sendKeys) {
    Android.sendKeys(all.map(n => KEYS[n][2]).join(','), 150);
  } else {
    vncCombo(all.map(n => KEYS[n]));
  }
}

function sendChar(ch) {
  const sym = keysyms.lookup(ch.codePointAt(0));
  vncCombo([...takeMods().map(m => KEYS[m]), [sym, null]], 25);
}

// ---- toolbar ----
const frow = document.getElementById('frow');
for (let n = 1; n <= 12; n++) {
  const b = document.createElement('button');
  b.textContent = 'F' + n;
  b.onclick = () => press('F' + n);
  frow.appendChild(b);
}
document.getElementById('fkeys').onclick = () => frow.classList.toggle('show');
document.getElementById('toggle').onclick = () => bar.classList.toggle('hidden');
document.getElementById('close').onclick = () => window.Android && Android.close();
document.getElementById('k').onclick = () => {
  kbd.focus();
  window.Android && Android.toggleKeyboard();
};
for (const b of document.querySelectorAll('[data-key]')) b.onclick = () => press(b.dataset.key);
for (const b of document.querySelectorAll('[data-combo]')) b.onclick = () => press(...b.dataset.combo.split(' '));
for (const b of document.querySelectorAll('[data-mod]')) {
  b.onclick = () => {
    const m = b.dataset.mod;
    mods[m] = !mods[m];
    b.classList.toggle('on', mods[m]);
  };
}
// keep toolbar buttons from stealing VNC focus
bar.addEventListener('mousedown', e => { if (e.target.tagName === 'BUTTON') e.preventDefault(); });

// ---- Android soft keyboard → VNC ----
kbd.addEventListener('keydown', e => {
  if (KEYS[e.key] && !e.key.startsWith('F')) { e.preventDefault(); press(e.key); }
});
kbd.addEventListener('input', e => {
  if (e.isComposing || e.inputType === 'insertCompositionText') return;
  if (e.inputType === 'deleteContentBackward') press('Backspace');
  else if (e.inputType === 'insertLineBreak') press('Enter');
  else if (e.data) for (const ch of e.data) sendChar(ch);
  kbd.value = '';
});
kbd.addEventListener('compositionend', e => {
  if (e.data) for (const ch of e.data) sendChar(ch);
  kbd.value = '';
});

connect();
</script>
</body>
</html>
